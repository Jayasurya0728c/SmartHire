{% extends 'company/company_index.html' %}
{% block body %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">Login</h2>
                <form action="/myapp/change_password_post/" method="post">
                 {% csrf_token %}
                    <div class="form-group">
                        <label for="current password">Current Password</label>
                        <input type="password" class="form-control" name="currentpassword" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group">
                        <label for="new password">New Password</label>
                        <input type="password" class="form-control" name="newpassword" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm password">Confirm Password</label>
                        <input type="password" class="form-control" name="confirmpassword" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Change</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
