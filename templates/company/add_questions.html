{% extends 'company/company_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Questions</h2>
    <form method="post" action="/myapp/company_add_questions_post/">
        {% csrf_token %}



      <div class="row mb-3">
        <label for="questions" class="col-sm-4 ">Add question</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" name="questions" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Add options</label>
        <div class="col-sm-8">
         </div>
      </div>

      <div class="row mb-3">
        <label for="option1" class="col-sm-4 ">Option 1</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" name="option1" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="option2" class="col-sm-4 ">Option 2</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" name="option2" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="option3" class="col-sm-4 ">Option 3</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" name="option3" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="option4" class="col-sm-4 ">Option 4</label>
        <div class="col-sm-8">
          <input type="text"   class="form-control" name="option4" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="Answer" class="col-sm-4 ">Correct answer</label>
        <div class="col-sm-8">
          <input type="text"   class="form-control" name="Answer" required>
        </div>
      </div>


        <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </div>

    </form>
  </div>
{% endblock %}
