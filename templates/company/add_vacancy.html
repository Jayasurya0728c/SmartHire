{% extends 'company/company_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Add Vacancies</h2>
    <form action="/myapp/company_add_vacancy_post/" method="post">
        {% csrf_token %}

      <div class="row mb-3">
        <label for="position" class="col-sm-4 ">Position</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="position" required name="Position">
        </div>
      </div>

      <div class="row mb-3">
        <label for="vacancies" class="col-sm-4 ">Number of vacancies</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="vacancies" required name="Number_of_vacancies">
        </div>
      </div>

      <div class="row mb-3">
        <label for="description" class="col-sm-4 ">Description</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="description" required name="Description">
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Add Vacancy</button>
        </div>
      </div>

    </form>
  </div>
{% endblock %}
