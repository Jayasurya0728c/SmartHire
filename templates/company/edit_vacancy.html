{% extends 'company/company_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Edit Vacancies</h2>
    <form action="/myapp/company_edit_vacancy_post/" method="post">
        {%csrf_token %}


                <input type="hidden" name="id" value="{{ data.id }}">

      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Position</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" required name="Position" value="{{data.Position}}">
        </div>
      </div>

        <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Number_of_vacancies</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" required name="Number_of_vacancies" value="{{data.Number_of_vacancies}}">
        </div>
      </div>


      <div class="row mb-3">
        <label for="dob" class="col-sm-4 ">Date</label>
        <div class="col-sm-8">
          <input type="date" class="form-control" id="date" required name="Date" value="{{data.Date|date:'Y-m-d'}}">
        </div>
      </div>


      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Description</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" required name="Description" value="{{data.Description}}">
        </div>
      </div>




      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
