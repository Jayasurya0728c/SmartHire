{% extends 'company/company_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Edit Test</h2>
    <form action="/myapp/company_edit_test_post/" method="post">
        {% csrf_token %}

        <input type="hidden" name="id" value="{{ data.id }}">

      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" required name="Name" value="{{data.Name}}">
        </div>
      </div>

      <div class="row mb-3">
        <label for="Date" class="col-sm-4 ">Date</label>
        <div class="col-sm-8">
          <input type="date" class="form-control" id="date" required name="Date" value="{{data.Date|date:'Y-m-d'}}">
        </div>
      </div>

      <div class="row mb-3">
        <label for="Time" class="col-sm-4 ">Time</label>
        <div class="col-sm-8">
          <input type="time" class="form-control" id="Time" required name="Time" value="{{data.Time}}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
