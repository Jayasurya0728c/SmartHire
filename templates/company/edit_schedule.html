{% extends 'company/company_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Edit Schedule</h2>
    <form method="post" action="/myapp/company_edit_schedule_post/">
        {% csrf_token %}

        <input type="hidden" value="{{ data.id }}" name="id">

      <div class="row mb-3">
        <label for="TEST" class="col-sm-4">Test</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ data.TEST.Name }}" readonly>
          <input type="hidden" value="{{ data.TEST.id }}" name="Test">
        </div>
      </div>

      <div class="row mb-3">
        <label for="Date" class="col-sm-4">Date</label>
        <div class="col-sm-8">
          <input type="date" class="form-control" value="{{ data.Date|date:'Y-m-d' }}" name="Date" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="stime" class="col-sm-4">Start time</label>
        <div class="col-sm-8">
          <input type="time" class="form-control" value="{{ data.Starttime|time:'H:i' }}" name="stime" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="time" class="col-sm-4">End time</label>
        <div class="col-sm-8">
          <input type="time" class="form-control" value="{{ data.Endtime|time:'H:i' }}" name="time" required>
        </div>
      </div>

       <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
