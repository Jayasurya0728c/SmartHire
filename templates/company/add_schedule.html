{% extends 'company/company_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Schedule management</h2>
    <form method="post" action="/myapp/company_add_schedule_post/">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ data.id }}">


      <div class="row mb-3">
        <label for="date" class="col-sm-4 ">Date</label>
        <div class="col-sm-8">
          <input type="date" class="form-control" id="date" name="Date" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="time" class="col-sm-4 ">Start time</label>
        <div class="col-sm-8">
          <input type="time" class="form-control" id="time" name="Starttime" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="time" class="col-sm-4 ">End time</label>
        <div class="col-sm-8">
          <input type="time"  class="form-control" id="time" name="Endtime" required>
        </div>
      </div>


       <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
