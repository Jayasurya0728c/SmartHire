{% extends 'company/company_index.html' %}
{% block body %}

<div class="container-fluid mt-4" id="a">
    <h2 class="mb-4 text-white fw-bold">Candidate Messages</h2>

    <div class="row">
        {% for u in data %}
        <div class="col-md-4 col-lg-3 mb-4">
            <div class="card shadow-sm border-0 h-100" style="background-color: #1E293B; border-radius: 15px; transition: transform 0.2s;">
                <div class="card-body p-4 text-center">
                    <img src="{{ u.photo }}" class="rounded-circle mb-3 shadow-sm" style="width: 80px; height: 80px; object-fit: cover; border: 3px solid rgba(255,255,255,0.1);">

                    <h5 class="text-white fw-bold mb-1">{{ u.name }}</h5>
                    <p class="text-white-50 small mb-3">{{ u.position }}</p>

                    <a href="/myapp/chat1/{{ u.auth_id }}" class="btn btn-sm w-100 rounded-pill fw-bold py-2" style="background-color: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.4); transition: 0.3s;">
                        <i class="fas fa-comment-dots me-1"></i> Open Chat
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="card shadow-sm border-0" style="background-color: #1E293B; border-radius: 15px;">
                <div class="card-body text-center py-5">
                    <i class="fas fa-inbox mb-3" style="font-size: 3rem; color: rgba(255,255,255,0.2);"></i>
                    <h5 class="text-white-50">No active conversations yet.</h5>
                    <p class="text-white-50 small">Approve candidates from the Applications page to start chatting!</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    /* Add a slight hover float effect to the cards */
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.3) !important;
    }
    .btn:hover {
        background-color: rgba(99, 102, 241, 0.4) !important;
        color: white !important;
    }
</style>

{% endblock %}
