{% extends 'company/company_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Test</h2>
    <form action="/myapp/company_add_test_post/" method="post">
        {% csrf_token %}

      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" required name="Name">
          <input type="hidden" class="form-control" name="vid" value="{{ vid }}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </div>

    </form>
  </div>
{% endblock %}
