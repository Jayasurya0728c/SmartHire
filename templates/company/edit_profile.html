{% extends 'company/company_index.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Company Profile</h2>
    <form action="/myapp/company_edit_profile_post/" method="post" enctype="multipart/form-data">
{% csrf_token %}


        <input type="hidden" name="id" value="{{ data.id }}">
      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Company Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" required value="{{ data.Company_name }}" name="Company_name">
        </div>
      </div>


      <div class="row mb-3">
        <label for="dob" class="col-sm-4 ">Company Id</label>
        <div class="col-sm-8">
          <input type="tel" class="form-control" id="comapny_id" required value="{{ data.Company_id }}" name="Company_id">
        </div>
      </div>

      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
        <div class="col-sm-8">
          <input type="email" class="form-control" id="email" required value="{{ data.Email }}" name="Email">
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}" class="form-control" id="phone" required value="{{ data.phone }}" name="phone">
        </div>
      </div>

        <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">License</label>
        <div class="col-sm-8">
          <input type="tel"  class="form-control" id="licensee" required value="{{ data.License }}" name="License">
        </div>
      </div>

      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Post</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="post" required value="{{ data.Post }}" name="Post">
        </div>
      </div>

      <div class="row mb-3">
        <label for="city" class="col-sm-4 ">City</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="city" required value="{{ data.City }}" name="City">
        </div>
      </div>

      <div class="row mb-3">
        <label for="state" class="col-sm-4 ">State</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="state" required value="{{ data.State }}" name="State">
        </div>
      </div>

      <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Pincode</label>
        <div class="col-sm-8">
          <input type="text" pattern="[0-9]{6}" class="form-control" id="pincode" required value="{{ data.Pincode }}" name="Pincode">
        </div>
      </div>

      <div class="row mb-3">
        <label for="photo" class="col-sm-4 ">Upload Photo</label>
        <div class="col-sm-8">
            <img src="{{ data.Photo }}" height="100" width="100">
          <input type="file" class="form-control" id="photo" accept="image/*" name="Photo">
        </div>
      </div>

        <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">About</label>
        <div class="col-sm-8">
          <input type="text"  class="form-control" id="about" required value="{{ data.About }}" name="About">
        </div>
      </div>


      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
